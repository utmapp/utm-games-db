# Rotate the server log weekly and keep 8 copies. launchd opened the log for
# the process, which never reopens it, so rotation sends SIGTERM (15) to the
# pid in gamesdb.pid: the server shuts down cleanly, launchd restarts it and
# opens the new file. Expect a "shutting down" entry early on Sunday.
# install.sh fills in __PREFIX__/__USER__ and places this at /etc/newsyslog.d/gamesdb.conf.
# logfilename                  [owner:group]   mode count size when  flags pid_file                        sig
__PREFIX__/log/gamesdb.log     __USER__:staff  640  8     *    $W0D0 -     __PREFIX__/data/gamesdb.pid     15
