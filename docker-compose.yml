services:
  gamesdb:
    build: .
    image: utm-games-db
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: ":8080"
      # Bound inside the container only; use `docker compose exec` or an SSH
      # tunnel plus `docker compose port` to reach it. Not published below.
      INTERNAL_LISTEN_ADDR: "127.0.0.1:8081"
    ports:
      # Public site, proxied by Cloudflare. Bind to localhost if a local
      # reverse proxy terminates TLS; expose directly if Cloudflare connects
      # straight to the host. Behind a local proxy the server sees this
      # network's gateway as the peer, not Cloudflare: add that address (as a
      # /32) to TRUSTED_PROXY_CIDRS (see README, Cloudflare).
      - "127.0.0.1:8080:8080"
    volumes:
      - gamesdb-data:/data

volumes:
  gamesdb-data:
